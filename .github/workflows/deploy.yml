name: Build and deploy

on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'scripts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The engine is asserted against the retired spreadsheet on every deploy.
      # If scoring ever drifts, the site does not ship.
      - name: Verify scoring engine
        run: node scripts/validate-engine.mjs

      - name: Build site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
