name: League emails

# Times are UTC because cron does not understand daylight saving, so the
# Central times below shift by an hour when DST ends (1 Nov 2026, ~Week 9).
#   14:00 UTC = 9am CDT / 8am CST
#   22:00 UTC = 5pm CDT / 4pm CST
#
# Lineups lock Thursday 7:15 PM CT, so every reminder sits safely ahead of it:
# the latest (Thu 22:00 UTC) is 2h15m before lock in summer, 3h15m in winter.
#
# The Tuesday standings cron is only a BACKSTOP. The standings email is
# normally sent by deploy.yml the moment a week's CSV is ingested, whatever
# time that happens - see that workflow. --once keeps the two from doubling up.
# GitHub's scheduler is best-effort: ticks run late under load and are
# sometimes dropped outright (one was dropped on 2026-09-16 because this file
# had been edited four minutes earlier). So every send has a retry 35 minutes
# later that maps to the SAME slot. --once is keyed by slot, so the retry is a
# no-op when the first one worked and a rescue when it did not.
on:
  schedule:
    - cron: '0 14 * * 2'    # Tue  9:00am CDT - results backstop
    - cron: '35 14 * * 2'   #      9:35am     - retry
    - cron: '0 22 * * 3'    # Wed  5:00pm CDT - reminder 1, lock is tomorrow
    - cron: '35 22 * * 3'   #      5:35pm     - retry
    - cron: '0 14 * * 4'    # Thu  9:00am CDT - reminder 2, lock is tonight
    - cron: '35 14 * * 4'   #      9:35am     - retry
    - cron: '0 22 * * 4'    # Thu  5:00pm CDT - reminder 3, last call ~2h out
    - cron: '35 22 * * 4'   #      5:35pm     - retry, still ~1h40m before lock
  workflow_dispatch:
    inputs:
      kind:
        description: Which email to send
        required: true
        default: standings
        type: choice
        options: [launch, standings, reminder]
      dry:
        description: Dry run (build the email, send nothing)
        type: boolean
        default: true
      to:
        description: "Send to this ONE address only (leave blank to send to the league). Use this to test a real send without mailing 17 people."
        required: false
        type: string
      slot:
        description: "Which scheduled variant to imitate. Changes the urgency wording and, for a real send, the de-duplication key."
        required: false
        default: manual
        type: choice
        options: [manual, wed-pm, thu-am, thu-pm]

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide which email this run sends
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry }}"   >> "$GITHUB_OUTPUT"
            echo "to=${{ inputs.to }}"     >> "$GITHUB_OUTPUT"
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry=false" >> "$GITHUB_OUTPUT"
            # Each pair maps to one slot, so the retry cannot double-send.
            case "${{ github.event.schedule }}" in
              "0 14 * * 2"|"35 14 * * 2") echo "kind=standings" >> "$GITHUB_OUTPUT"
                                          echo "slot=tue-am"    >> "$GITHUB_OUTPUT" ;;
              "0 22 * * 3"|"35 22 * * 3") echo "kind=reminder"  >> "$GITHUB_OUTPUT"
                                          echo "slot=wed-pm"    >> "$GITHUB_OUTPUT" ;;
              "0 14 * * 4"|"35 14 * * 4") echo "kind=reminder"  >> "$GITHUB_OUTPUT"
                                          echo "slot=thu-am"    >> "$GITHUB_OUTPUT" ;;
              "0 22 * * 4"|"35 22 * * 4") echo "kind=reminder"  >> "$GITHUB_OUTPUT"
                                          echo "slot=thu-pm"    >> "$GITHUB_OUTPUT" ;;
              *)                          echo "kind=reminder"  >> "$GITHUB_OUTPUT"
                                          echo "slot=manual"    >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # Off-season guard: no ingested weeks means no email, ever.
      - name: Skip if the season is not running
        id: guard
        run: |
          COUNT=$(ls data/weeks/*.csv 2>/dev/null | wc -l | tr -d ' ')
          echo "weeks=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then echo "No weeks ingested - skipping."; fi

      - name: Send
        if: steps.guard.outputs.weeks != '0'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LEAGUE_EMAILS: ${{ secrets.LEAGUE_EMAILS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ steps.pick.outputs.to }}" ]; then
            # A single-recipient test send. --once is deliberately omitted so a
            # test cannot mark the real email as already sent.
            ARGS="--to ${{ steps.pick.outputs.to }}"
          else
            ARGS="--once"
          fi
          if [ -n "${{ steps.pick.outputs.slot }}" ]; then
            ARGS="$ARGS --slot ${{ steps.pick.outputs.slot }}"
          fi
          if [ "${{ steps.pick.outputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          echo "running: email.mjs ${{ steps.pick.outputs.kind }} $ARGS"
          node scripts/email.mjs "${{ steps.pick.outputs.kind }}" $ARGS

      - name: Remember what was sent
        if: steps.guard.outputs.weeks != '0'
        run: |
          if ! git diff --quiet data/email-log.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/email-log.json
            git commit -m "Log ${{ steps.pick.outputs.kind }} email [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-preview
          path: out/
          if-no-files-found: ignore
